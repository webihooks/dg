name: deegeecard_partner_app
description: "DEEGEECARD PARTNER APP"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^5.2.1
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  shared_preferences: ^2.2.2
  http: ^1.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # Remove these for Phase 1 to avoid conflicts:
  # flutter_local_notifications: ^16.3.3
  # permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  flutter_launcher_icons: ^0.13.1

flutter:
  assets:
    - assets/icon/
    - assets/sounds/new_order.wav

  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"  
  adaptive_icon_background: "#FFFFFF"  
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"  