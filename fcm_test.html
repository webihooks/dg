<!DOCTYPE html>
<html>
<head>
    <title>FCM Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>FCM Push Notification Test</h1>
    
    <button onclick="initFCM()">Initialize FCM</button>
    <button onclick="testPush()">Send Test Push</button>
    <button onclick="checkTokens()">Check Registered Tokens</button>
    
    <div id="log" class="log"></div>
    
    <script>
    const log = document.getElementById('log');
    
    function addLog(message) {
        log.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' - ' + message + '</div>';
        log.scrollTop = log.scrollHeight;
        console.log(message);
    }
    
    async function initFCM() {
        addLog('🔄 Starting FCM initialization...');
        
        // Check browser support
        if (!('serviceWorker' in navigator)) {
            addLog('❌ Service Worker not supported');
            return;
        }
        
        if (!('PushManager' in window)) {
            addLog('❌ Push Manager not supported');
            return;
        }
        
        if (!('Notification' in window)) {
            addLog('❌ Notifications not supported');
            return;
        }
        
        addLog('✅ Browser supports FCM');
        
        try {
            // Register service worker
            addLog('🔄 Registering service worker...');
            const registration = await navigator.serviceWorker.register('/fcm-sw.js');
            addLog('✅ Service Worker registered');
            
            // Check current subscription
            let subscription = await registration.pushManager.getSubscription();
            
            if (subscription) {
                addLog('✅ Already subscribed to push');
                await saveSubscription(subscription);
                return;
            }
            
            // Request permission
            addLog('🔄 Requesting notification permission...');
            const permission = await Notification.requestPermission();
            
            if (permission !== 'granted') {
                addLog('❌ Notification permission denied: ' + permission);
                return;
            }
            
            addLog('✅ Notification permission granted');
            
            // Subscribe to push
            addLog('🔄 Subscribing to push notifications...');
            subscription = await subscribeToPush(registration);
            
            if (subscription) {
                addLog('✅ Push subscription created');
                await saveSubscription(subscription);
                addLog('🎉 FCM setup completed successfully!');
            } else {
                addLog('❌ Failed to create push subscription');
            }
            
        } catch (error) {
            addLog('❌ FCM initialization failed: ' + error.message);
        }
    }
    
    async function subscribeToPush(registration) {
        try {
            const vapidPublicKey = 'BA_40giep4c7wQZcDwmq_u23SFwDrgPwoCFrrPt2MR-aCMBW324yqvAsATjlzowX4cCtSbh1a7fC10rxi_3IY3U';
            
            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
            });
            
            return subscription;
        } catch (error) {
            addLog('❌ Subscription error: ' + error.message);
            return null;
        }
    }
    
    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        
        return outputArray;
    }
    
    async function saveSubscription(subscription) {
        try {
            addLog('🔄 Saving subscription to server...');
            
            const response = await fetch('save_fcm_token.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    token: JSON.stringify(subscription),
                    user_id: 28 // Your user ID
                })
            });
            
            const result = await response.json();
            
            if (result.success) {
                addLog('✅ Token saved successfully on server');
            } else {
                addLog('❌ Failed to save token: ' + result.message);
            }
        } catch (error) {
            addLog('❌ Error saving token: ' + error.message);
        }
    }
    
    async function testPush() {
        try {
            addLog('🔄 Sending test push notification...');
            
            const response = await fetch('test_push.php');
            const result = await response.json();
            
            if (result.success) {
                addLog('✅ Test push sent successfully');
            } else {
                addLog('❌ Test push failed: ' + result.message);
            }
        } catch (error) {
            addLog('❌ Error sending test: ' + error.message);
        }
    }
    
    async function checkTokens() {
        try {
            addLog('🔄 Checking registered tokens...');
            
            const response = await fetch('test_fcm_registration.php');
            const text = await response.text();
            
            addLog('📋 Token check result loaded');
            console.log('Token check:', text);
        } catch (error) {
            addLog('❌ Error checking tokens: ' + error.message);
        }
    }
    
    // Auto-init after page load
    setTimeout(() => {
        addLog('Page loaded. Click "Initialize FCM" to start.');
    }, 1000);
    </script>
</body>
</html>
