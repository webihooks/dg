<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pegasus Brew House</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://deegeecard.com/pegasusbrewhouse" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>
    <script>
        // Keep the iframe in sync with browser URL
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'navigation') {
                window.history.pushState({}, '', event.data.url);
            }
        });
    </script>
</body>
</html>
